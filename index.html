<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Dosis:wght@700;800&family=Red+Hat+Display:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles/app_updated.css" />

  <title>MovieApp</title>
</head>
<body>
  <header id="header" class="header-container">
    <span class="header-arrow inactive">&lt;</span>
    <h1 class="header-title">MovieApp</h1>
    <h1 class="header-title header-title--categoryView inactive">Acción</h1>
    <nav id="navDesktop" class="main-nav main-nav--desktop" aria-label="Principal"></nav>
    <form id="searchForm" class="header-searchForm">
      <input type="text" placeholder="Vengadores" />
      <button id="searchBtn">🔍</button>
    </form>
  </header>

  <section id="trendingPreview" class="trendingPreview-container">
    <div class="trendingPreview-header">
      <h2 class="trendingPreview-title">Tendencias</h2>
      <button class="trendingPreview-btn">Ver todas</button>
    </div>

    <div class="hero" role="region" aria-roledescription="carrusel" aria-label="Películas en tendencia">
      <div class="hero-track" aria-live="polite">
        <!-- inyeccion de slides de tendencias -->
      </div>

      <button type="button" class="hero-nav hero-nav--prev" aria-label="Slide anterior">‹</button>
      <button type="button" class="hero-nav hero-nav--next" aria-label="Siguiente slide">›</button>

      <div class="hero-controls">
        <button type="button" class="hero-toggle" aria-label="Pausar carrusel">❚❚</button>
        <div class="hero-dots"></div>
      </div>
    </div>
  </section>

  <section id="categoriesPreview" class="categoriesPreview-container">
    <h2 class="categoriesPreview-title">Categorías</h2>

    <article class="categoriesPreview-list">
      <!-- inyeccion de lista de generos -->
    </article>
  </section>

  <section id="favoritesPreview" class="favoritesPreview-container is-empty">
    <div class="homeRow-header">
      <h2 class="homeRow-title">Favoritos</h2>
      <button type="button" class="homeRow-btn favoritesPreview-btn inactive">Ver todos</button>
    </div>

    <article class="favoritesPreview-movieList">
      <!-- inyeccion de peliculas favoritas -->
    </article>
  </section>

  <div id="homeRows"></div>

  <section id="personInfo" class="personInfo-container inactive">
    <div class="personInfo-card">
      <div class="personInfo-photo" role="img"></div>

      <div class="personInfo-head">
        <h1 class="personInfo-name"></h1>
        <p class="personInfo-meta inactive"></p>
      </div>

      <div class="personInfo-bioBlock">
        <p class="personInfo-bio"></p>
        <button type="button" class="personInfo-more inactive">Leer más</button>
        <p class="personInfo-bioNote inactive"></p>
      </div>
    </div>

    <div class="personInfo-tabs inactive"></div>
  </section>
  <section id="libraryPanel" class="library-container inactive">
    <div class="library-header">
      <h2 class="library-title">Mis listas</h2>
      <button type="button" class="list-btn library-new">+ Nueva lista</button>
    </div>
    <div class="library-grid"></div>
  </section>

  <section id="listToolbar" class="listToolbar-container inactive">
    <p class="listToolbar-count"></p>
    <div class="listToolbar-actions">
      <button type="button" class="list-btn list-btn--ghost listToolbar-rename">Renombrar</button>
      <button type="button" class="list-btn list-btn--danger listToolbar-delete">Eliminar</button>
    </div>
  </section>

  <section id="genericList" class="genericList-container inactive">
    <div class="movie-container">
      <!-- Iyeccion de peliculas por categoria -->
  </section>

  <section id="peopleSection" class="people-container inactive">
    <div class="people-tabs" role="group" aria-label="Tipo de persona">
      <button type="button" class="personInfo-tab people-tab" data-kind="actors" aria-pressed="true">Actores</button>
      <button type="button" class="personInfo-tab people-tab" data-kind="directors" aria-pressed="false">Directores</button>
    </div>

    <h2 class="people-title">Actores populares</h2>
    <div class="people-list"></div>
  </section>
  <section id="searchPanel" class="searchPanel-container inactive">
    <div class="searchPanel-block searchPanel-recent is-empty">
      <div class="searchPanel-header">
        <h2 class="searchPanel-title">Búsquedas recientes</h2>
        <button type="button" class="searchPanel-clear">Borrar</button>
      </div>
      <ul class="searchPanel-recentList"></ul>
    </div>

    <div class="searchPanel-block">
      <h2 class="searchPanel-title">Explorar por categoría</h2>
      <div class="searchPanel-categories categories-list"></div>
    </div>
  </section>

  <section id="movieDetail" class="movieDetail-container inactive">
    <div class="movieDetail-hero">
    <h1 class="movieDetail-title"></h1>
    <div class="movieDetail-actions">
      <span class="movieDetail-score"></span> 
      <button type="button" class="fav-btn fav-btn--detail">
        <span class="fav-btn__icon" aria-hidden="true"></span>
        <span class="fav-btn__label"></span>
      </button>
      <button type="button" class="trailer-btn inactive">
        <span aria-hidden="true">▶</span> Ver tráiler
      </button>
      <button type="button" class="list-add-btn inactive">+ Añadir a lista</button>
    </div>
    <p class="movieDetail-meta"></p>
    <p class="movieDetail-description"></p>

    <article class="categories-list">
      <div class="category-container">
        <h3  class="category-title"></h3>
      </div>

      <div class="category-container">
        <h3 class="category-title"></h3>
      </div>

      <div class="category-container">
        <h3 class="category-title"></h3>
      </div>
    </article>
    </div>
    <article class="cast-container">
      <h2 class="cast-title">Reparto</h2>
      <div class="cast-list"></div>
    </article>


    <article class="relatedMovies-container">
      <h2 class="relatedMovies-title">Películas similares</h2>

      <div class="relatedMovies-scrollContainer">
        
      </div>
    </article>
    
  </section>

  <footer>Proyecto de consumo de API con JS</footer>

  <dialog id="trailerModal" class="trailer-modal" aria-label="Tráiler">
    <button type="button" class="trailer-close" aria-label="Cerrar tráiler">✕</button>
    <div class="trailer-frame"></div>
  </dialog>

  <dialog id="listFormDialog" class="list-dialog" aria-labelledby="listFormTitle">
  <form id="listForm" class="list-form" novalidate>
    <h2 id="listFormTitle" class="list-dialog-title">Nueva lista</h2>
    <input type="text" id="listFormInput" maxlength="40" autocomplete="off"
           placeholder="Ej. Mis pelis de terror" aria-label="Nombre de la lista">
    <p id="listFormError" class="list-error inactive" role="alert"></p>
    <div class="list-dialog-actions">
      <button type="button" id="listFormCancel" class="list-btn list-btn--ghost">Cancelar</button>
      <button type="submit" class="list-btn">Guardar</button>
    </div>
  </form>
</dialog>

<dialog id="addToListDialog" class="list-dialog" aria-labelledby="addToListTitle">
    <div class="list-form">
      <h2 id="addToListTitle" class="list-dialog-title">Añadir a una lista</h2>
      <ul id="addToListItems" class="addToList-items"></ul>
      <form id="addToListForm" class="addToList-new" novalidate>
        <input type="text" id="addToListInput" maxlength="40" autocomplete="off"
              placeholder="Nueva lista…" aria-label="Nombre de la nueva lista">
        <button type="submit" class="list-btn">Crear</button>
      </form>
      <p id="addToListError" class="list-error inactive" role="alert"></p>
      <div class="list-dialog-actions">
        <button type="button" id="addToListClose" class="list-btn">Listo</button>
      </div>
    </div>
  </dialog>

  <nav id="navMobile" class="main-nav main-nav--mobile" aria-label="Principal"></nav>
  
  <script src="./src/secrets.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
  <script src="./src/nodes.js"></script>
  <script src="./src/media.js"></script>
  <script src="./src/favorites.js"></script>
  <script src="./src/recent.js"></script>
  <script src="./src/trailer.js"></script>
  <script src="./src/hero.js"></script>
  <script src="./src/main.js"></script>
  <script src="./src/rows.js"></script>
  <script src="./src/people.js"></script>
  <script src="./src/pagination.js"></script>
  <script src="./src/person.js"></script>
  <script src="./src/search.js"></script>
  <script src="./src/lists.js"></script>
  <script src="./src/navigation.js"></script>
</body>
</html>
